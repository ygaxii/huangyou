<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ygaxii 导航</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%A7%AD%3C/text%3E%3C/svg%3E" />
<style>
:root{
  --bg:#f5f6f9; --panel:#ffffff; --panel2:#fafbfd; --border:#e5e8ef;
  --text:#15181e; --dim:#6a7280; --faint:#9aa2ae;
  --accent:#2f6bff; --accent2:#1f4fd8; --soft:rgba(47,107,255,.10);
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 10px 26px -14px rgba(16,24,40,.22);
  --shadow-lg:0 2px 6px rgba(16,24,40,.06), 0 18px 40px -18px rgba(16,24,40,.28);
  --r:14px; color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#0d0f13; --panel:#15181f; --panel2:#1a1d25; --border:#252a34;
  --text:#e9ecf2; --dim:#9aa4b4; --faint:#6c7788;
  --accent:#5b8bff; --accent2:#82a6ff; --soft:rgba(91,139,255,.15);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 30px -16px rgba(0,0,0,.8);
  --shadow-lg:0 2px 8px rgba(0,0,0,.55), 0 22px 48px -20px rgba(0,0,0,.9);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--soft)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(130,140,160,.35);border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(130,140,160,.55);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ============ 布局 ============ */
.app{display:grid;grid-template-columns:266px minmax(0,1fr);min-height:100vh}

/* ============ 侧边栏 ============ */
.sidebar{
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  background:var(--panel);border-right:1px solid var(--border);
  padding:20px 14px 14px;z-index:40;
}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px}
.brand-logo{
  width:40px;height:40px;flex:0 0 40px;border-radius:12px;display:grid;place-items:center;
  font-size:21px;background:linear-gradient(140deg,var(--accent),#8b5cf6);
  box-shadow:0 6px 16px -8px var(--accent);color:#fff;overflow:hidden;
}
.brand-logo img{width:100%;height:100%;object-fit:cover}
.brand-name{font-weight:700;font-size:15.5px;letter-spacing:.2px;line-height:1.25}
.brand-sub{font-size:12px;color:var(--faint);line-height:1.4;margin-top:2px}

.nav{flex:1;overflow-y:auto;margin:0 -4px;padding:0 4px}
.nav-label{
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
  padding:10px 10px 8px;font-weight:600;
}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:8px 10px;margin-bottom:2px;
  border-radius:9px;color:var(--dim);font-size:14px;position:relative;
  transition:background .15s,color .15s;
}
.nav-item:hover{background:var(--panel2);color:var(--text)}
.nav-item.on{background:var(--soft);color:var(--accent);font-weight:600}
.nav-item.on .nav-ico{transform:scale(1.06)}
.nav-ico{transition:transform .15s}
.nav-ico{font-size:15px;width:18px;text-align:center;flex:0 0 18px}
.nav-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-count{
  font-size:11px;color:var(--faint);background:var(--panel2);
  border:1px solid var(--border);padding:0 6px;border-radius:99px;line-height:17px;
  font-variant-numeric:tabular-nums;
}
.nav-item.on .nav-count{color:var(--accent);background:transparent;border-color:transparent}

.side-foot{border-top:1px solid var(--border);padding:12px 4px 0;margin-top:8px;display:grid;gap:6px}
.side-btn{
  display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;
  font-size:13.5px;color:var(--dim);transition:background .15s,color .15s;
}
.side-btn:hover{background:var(--panel2);color:var(--text)}
.side-btn .ico{width:18px;text-align:center;font-size:14px}

/* ============ 主区 ============ */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;
  padding:12px 28px;background:var(--bg);
  background:color-mix(in srgb, var(--bg) 84%, transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.menu-btn{display:none;font-size:19px;padding:6px 8px;border-radius:9px;color:var(--dim)}
.menu-btn:hover{background:var(--panel2);color:var(--text)}
.search{position:relative;flex:1;max-width:430px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input{
  width:100%;padding:9px 40px 9px 36px;border-radius:10px;font-size:14px;
  background:var(--panel);border:1px solid var(--border);color:var(--text);
  outline:none;transition:border-color .15s, box-shadow .15s;
  -webkit-appearance:none;appearance:none;
}
.search input::-webkit-search-cancel-button,
.search input::-webkit-search-decoration{-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--faint)}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.search kbd{
  position:absolute;right:9px;top:50%;transform:translateY(-50%);
  font:11px/1 ui-monospace,monospace;color:var(--faint);
  border:1px solid var(--border);background:var(--panel2);border-radius:5px;padding:3px 5px;
}
.top-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.icon-btn{
  width:34px;height:34px;display:grid;place-items:center;border-radius:9px;color:var(--dim);
  transition:background .15s,color .15s;
}
.icon-btn:hover{background:var(--panel2);color:var(--text)}
.hit-num{font-size:12.5px;color:var(--faint);margin-right:6px;font-variant-numeric:tabular-nums}

.wrap{padding:0 28px 60px;max-width:1180px;width:100%;margin:0 auto}

/* ============ Hero ============ */
.hero{
  position:relative;overflow:hidden;margin:22px 0 6px;padding:30px 30px 26px;
  border:1px solid var(--border);border-radius:18px;background:var(--panel);
  box-shadow:var(--shadow);
}
.hero::before{
  content:"";position:absolute;inset:-60% -20% auto auto;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle, var(--soft), transparent 68%);pointer-events:none;
}
.hero::after{
  content:"";position:absolute;inset:auto auto -70% -12%;width:360px;height:360px;border-radius:50%;
  background:radial-gradient(circle, rgba(139,92,246,.13), transparent 68%);pointer-events:none;
}
.hero > *{position:relative;z-index:1}
.hero h1{
  position:relative;margin:0 0 8px;font-size:clamp(21px,2.6vw,28px);letter-spacing:-.4px;line-height:1.3;
}
.hero p{position:relative;margin:0;color:var(--dim);font-size:14.5px;max-width:60ch}
.stats{position:relative;display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.stat{
  display:flex;align-items:baseline;gap:6px;padding:5px 12px;border-radius:99px;
  background:var(--panel2);border:1px solid var(--border);font-size:12.5px;color:var(--dim);
}
.stat b{font-size:14px;color:var(--text);font-variant-numeric:tabular-nums}

/* 主站直链按钮 */
.hero-cta{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:18px}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;
  background:var(--accent);color:#fff;font-size:13.5px;font-weight:600;
  box-shadow:0 8px 18px -10px var(--accent);
  transition:transform .15s,box-shadow .15s,filter .15s;
}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 12px 22px -10px var(--accent)}
.btn:active{transform:translateY(0)}
.btn svg{opacity:.9}
.url-chip{
  font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--dim);
  background:var(--panel2);border:1px solid var(--border);border-radius:8px;
  padding:6px 10px;user-select:all;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.btn-ghost{
  display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;
  background:var(--panel2);border:1px solid var(--border);color:var(--dim);
  font-size:13px;font-weight:500;
  transition:color .15s,border-color .15s,transform .15s,background .15s;
}
.btn-ghost:hover{color:var(--text);border-color:var(--accent);transform:translateY(-1px)}
.btn-ghost:active{transform:translateY(0)}

/* ============ 分组 ============ */
.group{padding-top:34px;scroll-margin-top:78px}
.group-head{margin-bottom:15px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.group-head h2{
  margin:0;font-size:16.5px;letter-spacing:-.2px;display:flex;align-items:center;gap:8px;
}
.group-head h2 .gico{font-size:16px}
.group-head .gcount{
  font-size:11.5px;color:var(--faint);border:1px solid var(--border);
  border-radius:99px;padding:1px 7px;font-variant-numeric:tabular-nums;
}
.group-head p{margin:0;width:100%;color:var(--faint);font-size:13px;line-height:1.6}

/* ============ 卡片 ============ */
.grid{
  display:grid;gap:13px;
  grid-template-columns:repeat(auto-fill,minmax(232px,1fr));
}
.card{
  display:flex;flex-direction:column;gap:9px;padding:15px 16px 13px;
  background:var(--panel);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--shadow);position:relative;overflow:hidden;
  transition:transform .16s cubic-bezier(.2,.7,.3,1), box-shadow .16s, border-color .16s;
}
.card::after{
  content:"";position:absolute;inset:0 0 auto 0;height:2px;opacity:0;
  background:linear-gradient(90deg,var(--accent),#8b5cf6);transition:opacity .16s;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--accent) 38%,var(--border))}
.card:hover::after{opacity:1}
.card:active{transform:translateY(-1px)}
.card-top{display:flex;align-items:center;gap:8px}
.ico{
  width:38px;height:38px;flex:0 0 38px;border-radius:11px;display:grid;place-items:center;
  font-size:19px;background:var(--panel2);border:1px solid var(--border);overflow:hidden;
  transition:transform .16s;
}
.card:hover .ico{transform:scale(1.05)}
.ico img{width:100%;height:100%;object-fit:cover}
.badge{
  font-size:10.5px;line-height:1;padding:4px 6px;border-radius:6px;font-weight:600;
  background:var(--soft);color:var(--accent);letter-spacing:.02em;white-space:nowrap;
}
.card .arrow{margin-left:auto;color:var(--faint);opacity:.6;transition:transform .16s,color .16s,opacity .16s}
.card:hover .arrow{color:var(--accent);opacity:1;transform:translate(2px,-2px)}
.card h3{margin:0;font-size:14.5px;font-weight:650;line-height:1.4;letter-spacing:-.1px}
.card p{
  margin:0;font-size:12.5px;color:var(--dim);line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.card-foot{
  display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:9px;
  border-top:1px dashed var(--border);font-size:11.5px;color:var(--faint);
}
.card-foot .go{color:var(--accent);font-weight:600;opacity:.85}
.card .host{margin-left:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:58%}

/* ============ 空状态 / 页脚 ============ */
.empty{display:none;text-align:center;padding:70px 20px;color:var(--faint)}
.empty.show{display:block}
.empty .big{font-size:34px;margin-bottom:8px;opacity:.7}
.empty b{display:block;color:var(--dim);font-size:14.5px;font-weight:600;margin-bottom:4px}
.footer{
  margin-top:48px;padding-top:18px;border-top:1px solid var(--border);
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  font-size:12px;color:var(--faint);
}
.hide{display:none !important}

/* ============ 只有一个入口时自动精简 ============ */
body.minimal .search{display:none}
body.minimal .nav{display:none}
body.minimal .side-foot{margin-top:auto}

/* ============ 移动端 ============ */
.overlay{
  position:fixed;inset:0;background:rgba(8,10,14,.45);z-index:35;
  opacity:0;pointer-events:none;transition:opacity .2s;backdrop-filter:blur(2px);
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{
    position:fixed;left:0;top:0;width:280px;height:100%;
    transform:translateX(-102%);transition:transform .24s cubic-bezier(.3,.8,.4,1);
    box-shadow:0 0 40px rgba(0,0,0,.25);background:var(--panel);
  }
  body.nav-open .sidebar{transform:none}
  body.nav-open .overlay{opacity:1;pointer-events:auto}
  .menu-btn{display:block}
  .topbar{padding:10px 16px}
  .wrap{padding:0 16px 50px}
  .hero{padding:22px 20px;margin-top:16px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:11px}
  .card{padding:13px 13px 11px}
  .card .host{display:none}
  .search kbd{display:none}
  .hit-num{display:none}
}
@media (max-width:420px){
  .grid{grid-template-columns:1fr 1fr}
  .card h3{font-size:13.5px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
  .card:hover{transform:none}
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo" id="brandLogo"></div>
      <div>
        <div class="brand-name" id="brandName"></div>
        <div class="brand-sub" id="brandSub"></div>
      </div>
    </div>

    <nav class="nav" id="nav">
      <div class="nav-label">分类</div>
    </nav>

    <div class="side-foot" id="sideFoot"></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="打开菜单">☰</button>
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
        <input id="q" type="search" placeholder="搜索网页、描述或分类…" autocomplete="off" />
        <kbd>/</kbd>
      </div>
      <div class="top-right">
        <span class="hit-num" id="hitNum"></span>
        <button class="icon-btn" id="themeBtn" aria-label="切换主题" title="切换深浅色"></button>
      </div>
    </header>

    <div class="wrap">
      <section class="hero">
        <h1 id="heroTitle"></h1>
        <p id="heroDesc"></p>
        <div class="stats">
          <span class="stat"><b id="statLinks">0</b> 个网页</span>
          <span class="stat"><b id="statGroups">0</b> 个分类</span>
        </div>
        <div class="hero-cta" id="heroCta"></div>
      </section>

      <div id="content"></div>

      <div class="empty" id="empty">
        <div class="big">🔍</div>
        <b>没有找到匹配的网页</b>
        <span>换个关键词试试，或者按 Esc 清空</span>
      </div>

      <footer class="footer">
        <span id="footLeft"></span>
        <span>纯静态 · 单文件 · 无需任何依赖</span>
      </footer>
    </div>
  </div>
</div>

<div class="overlay" id="overlay"></div>

<script>
/* =======================================================================
   ① 只改这一块：你的网页列表
   -----------------------------------------------------------------------
   groups[]            分类，想加几个加几个
   groups[].id         锚点 id（可省略，会自动生成）
   groups[].name       分类名（显示在左侧和标题）
   groups[].icon       分类图标（emoji，可选）
   groups[].desc       分类说明（可选）
   groups[].items[]    卡片
     title             网页名字（必填）
     url               链接（必填）。可以是 https://… 也可以是本地相对路径 ./xxx/index.html
     desc              一句话介绍（可选，最多显示两行）
     icon              图标 emoji（可选，默认 🔗）
     img               图标图片地址（可选，填了就优先用图片代替 emoji）
     tag               右上角小标签，比如 "NEW"、"🔞"、"内网"
   ======================================================================= */
const SITE = {
  brand: {
    logo: "https://ygaxii.github.io/huangyou/logo.png",  // 图片地址或 emoji 都行
    name: "ygaxii 导航",
    sub: "资源站 · 常用入口"
  },
  hero: {
    title: "ygaxii 资源站 · 每日更新",
    desc: "311 款资源，免费分享、没有广告。点下面的按钮直接进站。",
    // 标题下面那个蓝色按钮，就是主站直链
    link: {
      label: "立即前往主站",
      url: "https://ygaxii.github.io/huangyou/",
      note: "ygaxii.github.io/huangyou",
      // 蓝色按钮旁边的小按钮（保留留言区）
      extra: [
        { label: "留言区 / 求游戏", url: "https://ygaxii.github.io/huangyou/qiuyou.html#comments" }
      ]
    }
  },
  // 左下角的按钮，不需要就删掉
  sideLinks: [
    { label: "回到主站",      icon: "🏠", url: "https://ygaxii.github.io/huangyou/" },
    { label: "求游戏 / 留言", icon: "💬", url: "https://ygaxii.github.io/huangyou/qiuyou.html#comments" }
  ],

  groups: [
    {
      id: "main",
      name: "我的站点",
      icon: "🏠",
      items: [
        { title: "黄油站", desc: "311 款资源 · 每日更新 · 免费无广告", url: "https://ygaxii.github.io/huangyou/", icon: "🎮", tag: "🔞" }
      ]
    }
  ]
};
/* ===================== ① 结束，下面不用动 ===================== */

(function () {
  "use strict";

  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const isExt = (u) => /^(https?:)?\/\//i.test(u || "");

  function hostOf(url) {
    if (isExt(url)) {
      try { return new URL(url, location.href).hostname.replace(/^www\./, ""); } catch (e) { return "外部链接"; }
    }
    return location.protocol === "file:" ? "本地页面" : "站内页面";
  }

  // 补全分组 id
  SITE.groups = SITE.groups || [];
  SITE.groups.forEach((g, i) => { g.id = g.id || "g" + (i + 1); g.items = g.items || []; });

  const totalLinks = SITE.groups.reduce((n, g) => n + g.items.length, 0);

  /* ---------- 品牌 / Hero ---------- */
  const logo = SITE.brand.logo || "🧭";
  const logoEl = $("#brandLogo");
  if (isExt(logo) || /\.(png|jpe?g|webp|svg|gif)(\?|$)/i.test(logo)) {
    const im = new Image();
    im.alt = "";
    im.onerror = () => { logoEl.textContent = "🧭"; };   // 图片挂了就退回 emoji
    im.src = logo;
    logoEl.textContent = "";
    logoEl.appendChild(im);
  } else {
    logoEl.textContent = logo;
  }
  $("#brandName").textContent = SITE.brand.name || "导航页";
  $("#brandSub").textContent = SITE.brand.sub || "";
  document.title = (SITE.brand.name || "导航页") + " · 导航";

  $("#heroTitle").textContent = SITE.hero.title || SITE.brand.name || "导航";
  $("#heroDesc").textContent = SITE.hero.desc || "";
  $("#statLinks").textContent = totalLinks;
  $("#statGroups").textContent = SITE.groups.length;
  if (totalLinks <= 1) {
    document.body.classList.add("minimal");   // 只有一个入口：收起搜索框和左侧分类
    const st = document.querySelector(".stats");
    if (st) st.style.display = "none";        // 这排数字也没意义
  }
  $("#footLeft").textContent = "© " + new Date().getFullYear() + " " + (SITE.brand.name || "导航页");

  /* ---------- 主站直链按钮 ---------- */
  const hl = SITE.hero.link;
  if (hl && hl.url) {
    const chip = hl.note || hl.url.replace(/^https?:\/\//, "");
    const extras = (hl.extra || []).map((x) =>
      '<a class="btn-ghost" href="' + esc(x.url) + '"' +
        (isExt(x.url) ? ' target="_blank" rel="noopener"' : "") + ">" +
        esc(x.label) +
      "</a>"
    ).join("");
    $("#heroCta").innerHTML =
      '<a class="btn" href="' + esc(hl.url) + '" target="_blank" rel="noopener">' +
        esc(hl.label || "立即前往") +
        '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>' +
      "</a>" + extras +
      '<span class="url-chip" title="主站直链，可直接复制">' + esc(chip) + "</span>";
  }

  /* ---------- 侧边栏导航 ---------- */
  const nav = $("#nav");
  nav.innerHTML =
    '<div class="nav-label">分类</div>' +
    SITE.groups.map((g) =>
      '<a class="nav-item" href="#' + esc(g.id) + '" data-target="' + esc(g.id) + '">' +
        '<span class="nav-ico">' + esc(g.icon || "📁") + "</span>" +
        '<span class="nav-name">' + esc(g.name) + "</span>" +
        '<span class="nav-count">' + g.items.length + "</span>" +
      "</a>"
    ).join("");

  const sideFoot = $("#sideFoot");
  (SITE.sideLinks || []).forEach((l) => {
    const a = document.createElement("a");
    a.className = "side-btn";
    a.href = l.url;
    if (isExt(l.url)) { a.target = "_blank"; a.rel = "noopener"; }
    a.innerHTML = '<span class="ico">' + esc(l.icon || "🔗") + "</span><span>" + esc(l.label) + "</span>";
    sideFoot.appendChild(a);
  });

  /* ---------- 卡片 ---------- */
  function cardHTML(it, g) {
    const url = it.url || "#";
    const ico = (it.img || /\.(png|jpe?g|webp|svg|gif)(\?|$)/i.test(it.icon || ""))
      ? '<img src="' + esc(it.img || it.icon) + '" alt="" loading="lazy">'
      : '<span>' + esc(it.icon || "🔗") + "</span>";
    const search = [it.title, it.desc, it.tag, g.name, g.desc, hostOf(url)]
      .filter(Boolean).join(" ").toLowerCase();

    return '<a class="card" href="' + esc(url) + '"' +
      (isExt(url) ? ' target="_blank" rel="noopener"' : "") +
      ' data-search="' + esc(search) + '">' +
        '<div class="card-top">' +
          '<div class="ico">' + ico + "</div>" +
          (it.tag ? '<span class="badge">' + esc(it.tag) + "</span>" : "") +
          '<svg class="arrow" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>' +
        "</div>" +
        "<h3>" + esc(it.title) + "</h3>" +
        (it.desc ? "<p>" + esc(it.desc) + "</p>" : "") +
        '<div class="card-foot">' +
          '<span class="go">点击前往 →</span>' +
          '<span class="host">' + esc(hostOf(url)) + "</span>" +
        "</div>" +
      "</a>";
  }

  $("#content").innerHTML = SITE.groups.map((g) =>
    '<section class="group" id="' + esc(g.id) + '">' +
      '<div class="group-head">' +
        "<h2>" + (g.icon ? '<span class="gico">' + esc(g.icon) + "</span>" : "") + esc(g.name) +
          '<span class="gcount">' + g.items.length + "</span></h2>" +
        (g.desc ? "<p>" + esc(g.desc) + "</p>" : "") +
      "</div>" +
      '<div class="grid">' + g.items.map((it) => cardHTML(it, g)).join("") + "</div>" +
    "</section>"
  ).join("");

  // 卡片图片加载失败时退回 emoji，不留破图标
  document.addEventListener("error", (e) => {
    const t = e.target;
    if (t && t.tagName === "IMG" && t.closest && t.closest(".ico")) {
      t.parentNode.textContent = "🔗";
    }
  }, true);

  /* ---------- 搜索 ---------- */
  const q = $("#q"), empty = $("#empty"), hitNum = $("#hitNum");
  const allCards = Array.from(document.querySelectorAll(".card"));
  const allGroups = Array.from(document.querySelectorAll(".group"));

  function filter() {
    const term = q.value.trim().toLowerCase();
    let shown = 0;
    allGroups.forEach((sec) => {
      let n = 0;
      sec.querySelectorAll(".card").forEach((c) => {
        const hit = !term || (c.dataset.search || "").includes(term);
        c.classList.toggle("hide", !hit);
        if (hit) n++;
      });
      sec.classList.toggle("hide", n === 0);
      shown += n;
    });
    empty.classList.toggle("show", shown === 0);
    hitNum.textContent = term ? shown + " / " + allCards.length : "";
    spy();
  }
  q.addEventListener("input", filter);
  q.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { q.value = ""; filter(); q.blur(); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement !== q && !/^(INPUT|TEXTAREA)$/.test((document.activeElement || {}).tagName || "")) {
      e.preventDefault(); q.focus();
    }
  });

  /* ---------- 滚动高亮 ---------- */
  const navItems = Array.from(document.querySelectorAll(".nav-item"));
  function spy() {
    let cur = null;
    allGroups.forEach((sec) => {
      if (sec.classList.contains("hide")) return;
      if (sec.getBoundingClientRect().top <= 150) cur = sec.id;
    });
    if (!cur) {
      const first = allGroups.find((s) => !s.classList.contains("hide"));
      cur = first ? first.id : null;
    }
    navItems.forEach((a) => a.classList.toggle("on", a.dataset.target === cur));
  }
  let ticking = false;
  window.addEventListener("scroll", () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => { spy(); ticking = false; });
  }, { passive: true });

  navItems.forEach((a) => a.addEventListener("click", () => {
    document.body.classList.remove("nav-open");
  }));

  /* ---------- 主题 ---------- */
  const root = document.documentElement, themeBtn = $("#themeBtn");
  const SUN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const MOON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';

  function applyTheme(t) {
    root.dataset.theme = t;
    themeBtn.innerHTML = t === "dark" ? SUN : MOON;
    themeBtn.title = t === "dark" ? "切换到浅色" : "切换到深色";
  }
  let saved = null;
  try { saved = localStorage.getItem("nav-theme"); } catch (e) {}
  const sysDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  applyTheme(saved || (sysDark ? "dark" : "light"));

  themeBtn.addEventListener("click", () => {
    const next = root.dataset.theme === "dark" ? "light" : "dark";
    applyTheme(next);
    try { localStorage.setItem("nav-theme", next); } catch (e) {}
  });

  /* ---------- 移动端菜单 ---------- */
  $("#menuBtn").addEventListener("click", () => document.body.classList.toggle("nav-open"));
  $("#overlay").addEventListener("click", () => document.body.classList.remove("nav-open"));
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") document.body.classList.remove("nav-open");
  });
  window.addEventListener("resize", () => {
    if (window.innerWidth > 900) document.body.classList.remove("nav-open");
  });

  spy();
})();
</script>
</body>
</html>
